packages:
  - "apps/*"
  - "packages/*"
  - "services/gateway"
# plugins/** stays outside: the PayBox plugin keeps its own lockfile (starter 1.0.2, pnpm 11.11.0) and imports the
# plugin-safe sources (packages/{config,networks,money}/src, packages/defi/src/core) by relative path.
# Python packages (packages/{core,tools,now}, services/api) have no package.json, so pnpm ignores them.

# Supply chain: never resolve a release younger than 7 days, transitive ones included (minutes). A brand-new
# mdast-util-to-markdown 2.1.3 (2026-09-27) crashed every docs page with emphasis in fumadocs' stringifier.
minimumReleaseAge: 10080
# First-party PayBox SDK (plan §3): pinned to the exact release PayBox documents, whatever its age.
minimumReleaseAgeExclude:
  - "@paybox-sh/sdk"

overrides:
  mdast-util-to-markdown: 2.1.2

# Native build scripts pnpm may run: esbuild (fumadocs-mdx), sharp (Next image optimisation and OG images).
# bufferutil and utf-8-validate come from the gateway's x402 / viem dependency (its WebSocket client): optional
# native speed-ups with pure-JS fallbacks, so their install scripts never run.
allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

# One version of each shared dependency across apps and packages (`"catalog:"` in a manifest).
# Next 16.3.4 + React 19.2.8 is the pair already proven in an earlier build (Stocklana); TypeScript stays on 5.9.
# Supply chain: every pin is the newest release at least a week old when chosen, not the latest. The entries below
# the first block are the plan's §3 pins (docs/plan/hako-plan.md, checked 2026-10-17); a lane adds a dependency to
# its own package.json as "catalog:" and never edits this file.
catalog:
  # Web, design and shared tooling
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@types/node": 24.12.3
  typescript: 5.9.3
  zod: 4.6.5
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  lucide-react: 1.47.0
  motion: 13.4.1
  server-only: 0.0.1
  eslint: 9.39.5
  eslint-config-next: 16.3.4
  typescript-eslint: 8.70.1
  clsx: 2.1.1
  class-variance-authority: 0.7.1
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  next-themes: 0.4.6
  "@number-flow/react": 0.6.2
  sonner: 2.0.8
  use-sound: 5.0.0
  # Logos, QR, charts, feed
  "@web3icons/react": 4.1.24
  blo: 2.1.1
  qrcode: 1.5.4
  lightweight-charts: 5.2.1
  "@tanstack/react-query": 5.104.1
  nuqs: 2.10.2
