packages:
  - "apps/*"
  - "packages/brand"
  - "packages/model"
  - "services/gateway"

# Supply chain: never resolve a release younger than 7 days, transitive ones included (minutes). A brand-new
# mdast-util-to-markdown 2.1.3 (2026-09-27) crashed every docs page with emphasis in fumadocs' stringifier.
minimumReleaseAge: 10080

overrides:
  mdast-util-to-markdown: 2.1.2

# Native build scripts pnpm may run: esbuild (fumadocs-mdx), sharp (Next image optimisation and OG images).
# bufferutil and utf-8-validate come from the gateway's x402 / viem dependency (its WebSocket client): optional
# native speed-ups with pure-JS fallbacks, so their install scripts never run.
allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

# One version of each shared dependency across apps and packages (`"catalog:"` in a manifest).
# Next 16.3.4 + React 19.2.8 is the pair already proven in an earlier build (Stocklana); TypeScript stays on 5.9.
# Supply chain: every pin is the newest release at least a week old when chosen (2026-09-30), not the latest.
catalog:
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "@types/node": 24.12.3
  typescript: 5.9.3
  zod: 4.6.5
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  lucide-react: 1.47.0
  motion: 13.4.1
  server-only: 0.0.1
  eslint: 9.39.5
  eslint-config-next: 16.3.4
  typescript-eslint: 8.70.1
  clsx: 2.1.1
  class-variance-authority: 0.7.1
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  next-themes: 0.4.6
  ai: 7.0.111
  "@ai-sdk/anthropic": 4.0.60
  "@ai-sdk/openai": 4.0.72
  "@ai-sdk/react": 4.0.125
  streamdown: 2.6.0
  "@x402/core": 2.27.0
  "@x402/evm": 2.27.0
  ioredis: 6.0.0
  fumadocs-core: 16.15.13
  fumadocs-ui: "npm:@fumadocs/base-ui@16.15.13"
  fumadocs-mdx: 15.4.3
  fumadocs-openapi: 12.0.2
  shiki: 4.4.3
  "@types/mdx": 2.0.14
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
