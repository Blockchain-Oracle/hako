  "@ai-sdk/mcp": 2.0.73
  "@ai-sdk/openai": 4.0.91
  "@ai-sdk/anthropic": 4.0.78
  streamdown: 2.6.0
  resumable-stream: 2.2.13
  "@shadcn/react": 0.3.1
  cn: 0.4.0
  # Voice
  "@openai/agents": 0.20.0
  # Gateway and x402
  hono: 4.13.12
  "@hono/node-server": 2.1.4
  "@x402/core": 2.27.0
  "@x402/evm": 2.27.0
  "@x402/hono": 2.27.0
  "@coinbase/cdp-sdk": 1.58.0
  ioredis: 6.0.0
  # Hako MCP (hosted + stdio) and the MCP Apps view
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/core": 2.3.1
  "@modelcontextprotocol/client": 2.3.1
