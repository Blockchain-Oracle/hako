[project]
name = "hako-tools"
version = "0.1.0"
description = "Hako tool router: connector framework (providers, endpoints, engine, catalog, discover, health) and connectors"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hako-core",
    "hako-now",
    "defusedxml>=0.7.1",
    "python-dotenv>=1.1",
    "redis>=6.4",
    "eth-abi>=5.2",
    "pycryptodome>=3.23",
    "solders>=0.27",
]

[project.scripts]
hako-tools = "hako_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hako_tools"]

[tool.uv.sources]
hako-core = { workspace = true }
hako-now = { workspace = true }
