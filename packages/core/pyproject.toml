[project]
name = "hako-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio>=4.10",
    "cashews[redis]>=7.6",
    "fastapi>=0.141",
    "httpx2[http2]>=2.13",
    "limits[async-redis]>=5.8",
    "orjson>=3.12",
    "prometheus-client>=0.23",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "stamina>=26.1",
    "structlog>=26.1",
    "zstandard>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hako_core"]
