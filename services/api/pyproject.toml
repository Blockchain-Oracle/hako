[project]
name = "hako-api"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hako-core",
    "hako-now",
    "hako-tools",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
hako-task = "hako_api.tasks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hako_api"]

[tool.uv.sources]
hako-core = { workspace = true }
hako-now = { workspace = true }
hako-tools = { workspace = true }
