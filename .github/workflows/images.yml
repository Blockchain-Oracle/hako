name: images
# web + docs → ghcr.io/blockchain-oracle/hako-{web,docs} (one shared Next Dockerfile);
# gateway → ghcr.io/blockchain-oracle/hako-gateway (services/gateway/Dockerfile);
# api → ghcr.io/blockchain-oracle/hako-api (services/api/Dockerfile). The PayBox plugin (plugins/) ships no image.
on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "services/gateway/**", "services/api/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "uv.lock", "pyproject.toml", "deploy/next-app/**", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: images, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one app failing must not cancel the others' images
      matrix:
        include:
          - { app: web, file: deploy/next-app/Dockerfile }
          - { app: docs, file: deploy/next-app/Dockerfile }
          - { app: gateway, file: services/gateway/Dockerfile }
          - { app: api, file: services/api/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/blockchain-oracle/hako-${{ matrix.app }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DOCS_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
